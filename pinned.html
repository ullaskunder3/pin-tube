<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pinned Videos</title>
<link rel="stylesheet" href="pinned.css">
</head>
<body>
<header>
<div class="logo">
<svg viewBox="0 0 24 24"><path d="M16 11V5h2V3H6v2h2v6l-2 3v2h5v6l1 1 1-1v-6h5v-2l-2-3z"/></svg>
Pinned Videos
</div>
<div class="actions">
<button id="select-all-btn" class="btn-ghost">Select all</button>
<button id="unpin-selected-btn" class="btn-danger" disabled>Unpin selected</button>
<button id="clear-all-btn" class="btn-danger">Clear all</button>
</div>
</header>
<main>
<div id="empty-state" class="empty">
<svg viewBox="0 0 24 24"><path d="M16 11V5h2V3H6v2h2v6l-2 3v2h5v6l1 1 1-1v-6h5v-2l-2-3zm-1 0H9V5h6v6z"/></svg>
<h2>No pinned videos</h2>
<p>Pin a video while watching on YouTube and it'll show up here.</p>
<a href="https://www.youtube.com" target="_blank">Go to YouTube</a>
</div>
<div id="video-grid" class="grid"></div>
</main>
<footer>Built with ❤️ by Ullas Kunder — <a href="https://ullaskunder.com" target="_blank">ullaskunder.com</a></footer>
<template id="video-card-template">
<div class="card">
<a class="thumb" href="#" target="_blank">
<input type="checkbox" class="check video-checkbox">
<img class="thumbnail" src="" alt="">
</a>
<div class="info">
<a class="title" href="#" target="_blank"></a>
<div class="meta">
<div>
<p class="channel"></p>
<p class="timeline"></p>
</div>
<button class="unpin unpin-btn" title="Unpin"><svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
</div>
</div>
</div>
</template>
<script src="pinned.js"></script>
</body>
</html>
